<!DOCTYPE html>

<html lang = "es">
    <head>
        <title> Cine Aurora </title>

        <link href = "style.css" rel = "stylesheet">
    </head>

    <header>
        <img src="./imagenes/logo.png" alt="Logo" class="logo">

        <nav>
            <a href="#">Dulcería</a>
            <a href="#">Cartelera</a>
            <a href="#">Perfil</a>

            <input type="text" class="barra-busqueda" placeholder="Buscar...">
        </nav>
    </header>
    
    <body>
        <main>
            <!-- Para hacer carrusel de fotos en movimiento automatico. -->
            <div class = "slider-box">
                <!-- ul es para hacer una lista de vinetas. -->
                <ul>
                    <!-- li es para hacer una lista enumerada u ordenada. -->
                    <li> <img src = "./imagenes/bar.jpg" alt = "Barbie"> </li>
                    <li> <img src = "./imagenes/jo.jpg" alt = "Joker"> </li>
                    <li> <img src = "./imagenes/odi.jpg" alt = "La Odisea"> </li>
                    <li> <img src = "./imagenes/pul.png" alt = "Pulp Fiction"> </li>
                    <li> <img src = "./imagenes/star.jpg" alt = "Star Wars"> </li>

                </ul>
            </div>

            <div class = "about-section">
                <h1> Cartelera </h1>
            </div>

            <div class="pelicula">
                <h2>Barbie la película</h2>

                <img src="imagenes/barbiePoster.jpg" alt="Barbie la película">

                <div class="informacion">
                    <span>M-13</span>
                    <span>1h 54min</span>
                </div>
            </div>

            <div class="pelicula">
                <h2>La Odisea</h2>

                <img src="imagenes/laOdiseaPoster.jpg" alt="La Odisea">

                <div class="informacion">
                    <span>M-12</span>
                    <span>2h 55min</span>
                </div>
            </div>

            <br> 

            <footer>
                <br> 
                <nav b>
                    <a href="#">Historia</a>
                </nav>  

                <div class =  "footer-container">
                    <p> Cines Aurora 2026. Derechos reservados. Términos y condiciones </p>
                </div>
            </footer>   
        </main>
    </body>
</html>
